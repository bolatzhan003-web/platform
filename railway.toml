[build]
builder = "nixpacks"

[env]
PYTHON_VERSION = "3.12"

[build.nixpacks]
providers = ["python"]

[[build.nixpacks.install]]
apt = ["gcc", "g++"]

[[nixpacks.phases.setup]]
cmds = ["pip install -r requirements.txt"]

[[nixpacks.phases.build]]
cmds = ["python manage.py collectstatic --noinput", "python manage.py migrate"]

[start]
cmd = "gunicorn lms.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
